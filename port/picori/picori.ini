[controls]
overlay = clear

a = x
b = z
# X and Y are the extra item buttons. Select + X opens the save-state
# picker ready to save, Select + Y ready to load (handled in the game).
x = c
y = v

l1 = a
r1 = s
# L2 saves a state to a new slot, R2 (held) fast-forwards.
l2 = home
r2 = tab

start = enter
back = backspace
guide = f8

up = up
down = down
left = left
right = right

left_analog = arrow_keys
