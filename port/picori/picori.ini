[controls]
overlay = clear

a = x
b = z
x = c
y = v

l1 = a
r1 = s
l2 = home
r2 = tab

start = enter
back = backspace
guide = f8

up = up
down = down
left = left
right = right

left_analog = arrow_keys

# SELECT held, via "-H back" on the gptokeyb2 command line: L2 saves to a new
# slot instead of loading. A key left out of a layer is unbound while SELECT
# is held, not inherited from [controls], so everything else is repeated
# verbatim; "back" is deliberately absent, its own key is the modifier.
[controls:hk_hotkey]
a = x
b = z
x = c
y = v

l1 = a
r1 = s
l2 = f6
r2 = tab

start = enter
guide = f8

up = up
down = down
left = left
right = right

left_analog = arrow_keys
