# scale=1 deliberately: the X screen then matches the 640x480 panel exactly,
# so weston composites 1:1 and applies NO filtering. At scale=2 (a 320x240 X
# screen) weston bilinear-upscales the result -- measured on the panel, zero
# of 320 column pairs were identical and one scanline carried 326 distinct
# colours from a 320px source, i.e. every pixel edge was smeared.
# The cost is real: present goes ~3.2ms -> ~7.5ms in play (the X socket has
# no MIT-SHM, so the whole 640x480 window is copied every frame) and the
# render cadence drops from ~30 to ~26.5 fps. Game speed is unaffected --
# tps stays pinned at 60.
[core]

[output]
name=VGA-0
scale=1

[input-method]
path=libexec/weston-keyboard
